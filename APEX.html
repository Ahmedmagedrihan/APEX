<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07080b">
<title>APEX MOTORSPORT 3D</title>
<style>
:root{
  --bg:#07080b; --bg2:#0d0f14; --panel:rgba(16,18,24,.72); --panel2:rgba(26,29,38,.78); --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --tx:#eef1f6; --dim:#9aa3b2; --mute:#69717f; --acc:#ff5a14; --acc2:#ff2d2d; --acc3:#ffb02e; --ok:#38d68b; --bad:#ff4a4a; --blue:#4aa8ff;
  --grad:linear-gradient(100deg,#ff2d2d,#ff5a14 55%,#ffa11f);
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
  --font:"Bahnschrift","DIN Alternate","Segoe UI","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --disp:"Bahnschrift SemiBold Condensed","Bahnschrift","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --ts:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:var(--tx);font-family:var(--font);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;position:fixed;inset:0;width:100%}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:#05060a;touch-action:none;outline:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc3);outline-offset:2px}
.hide{display:none!important}
#app{position:fixed;inset:0;pointer-events:none}
#app>*{pointer-events:auto}

/* ---------- boot / error ---------- */
#boot{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 40%,#171a24 0%,#07080b 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#boot .logo{font-family:var(--disp);font-weight:800;font-style:italic;letter-spacing:.06em;font-size:clamp(28px,min(8vw,13vh),76px);line-height:.95;text-transform:uppercase}
@media (max-height:480px){#boot{gap:10px;padding:12px}#bootErr{padding:10px 12px;font-size:13px}}
#boot{overflow-y:auto}
#boot .logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot .sub{color:var(--dim);letter-spacing:.34em;font-size:12px;text-transform:uppercase}
.bar{width:min(340px,70vw);height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--grad);transition:width .25s}
#bootMsg{color:var(--dim);font-size:14px;min-height:20px;max-width:560px}
#bootErr{max-width:560px;color:#ffd3c2;font-size:14px;line-height:1.5;background:rgba(255,60,30,.08);border:1px solid rgba(255,90,40,.35);padding:14px 16px;border-radius:12px}
#bootErr h3{margin:0 0 6px;font-size:16px;color:#fff}
#bootErr code{font-family:var(--mono);font-size:12px;color:#ffb89c;word-break:break-word}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:10px;background:var(--panel2);border:1px solid var(--line2);font-family:var(--disp);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
.btn:hover{border-color:rgba(255,255,255,.35);background:rgba(44,48,60,.85)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 24px rgba(255,70,20,.35);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{min-height:36px;padding:0 14px;font-size:12px}
.btn.lg{min-height:56px;padding:0 34px;font-size:18px}
.btn[disabled],.btn.off{opacity:.42;pointer-events:none;filter:grayscale(.5)}
.btn.danger{border-color:rgba(255,74,74,.5);color:#ffb3b3}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-size:10px;letter-spacing:.14em;font-weight:800;text-transform:uppercase;background:rgba(255,255,255,.08);color:var(--dim)}
.chip.on{background:var(--grad);color:#fff}
.chip.ok{background:rgba(56,214,139,.16);color:var(--ok)}
.chip.warn{background:rgba(255,176,46,.16);color:var(--acc3)}

/* ---------- screens ---------- */
#screens{position:fixed;inset:0;z-index:20;pointer-events:none}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(var(--sat) + 14px) calc(var(--sar) + 18px) calc(var(--sab) + 14px) calc(var(--sal) + 18px);pointer-events:auto;overflow:hidden;animation:fadeIn .28s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scr.dim{background:linear-gradient(90deg,rgba(5,6,9,.88) 0%,rgba(5,6,9,.55) 48%,rgba(5,6,9,.1) 100%)}
.scr.dimfull{background:rgba(5,6,9,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px;min-height:44px;flex:0 0 auto}
.top h2{margin:0;font-family:var(--disp);font-style:italic;font-weight:800;font-size:clamp(20px,3.4vw,30px);letter-spacing:.08em;text-transform:uppercase}
.top h2 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.top .sp{flex:1}
.wallet{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:13px}
.wallet span{padding:6px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}
.wallet .cr::before{content:"◆ ";color:var(--acc3)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-right:4px;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel h3{margin:0 0 10px;font-family:var(--disp);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:700}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.fx{display:flex;gap:10px;align-items:center}.fxw{flex-wrap:wrap}.fxc{flex-direction:column;align-items:stretch}.grow{flex:1;min-width:0}

/* ---------- main menu ---------- */
.menuWrap{display:flex;flex:1;min-height:0;align-items:stretch;gap:28px}
.menuL{display:flex;flex-direction:column;justify-content:center;gap:10px;width:min(420px,46vw);min-width:250px}
.brand{margin-bottom:16px}
.brand .a{font-family:var(--disp);font-weight:800;font-style:italic;font-size:clamp(34px,6.6vw,70px);line-height:.88;letter-spacing:.05em;text-transform:uppercase}
.brand .a b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .b{letter-spacing:.5em;color:var(--dim);font-size:clamp(9px,1.3vw,12px);margin-top:8px;text-transform:uppercase}
.mbtn{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 20px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-family:var(--disp);font-weight:700;font-size:clamp(15px,2.2vw,19px);letter-spacing:.14em;text-transform:uppercase;transition:transform .12s,border-color .15s,background .15s;overflow:hidden;text-align:left}
.mbtn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad);opacity:0;transition:opacity .15s}
.mbtn:hover,.mbtn:focus-visible{border-color:rgba(255,120,60,.55);background:rgba(34,24,22,.78);transform:translateX(4px)}
.mbtn:hover::before{opacity:1}
.mbtn small{font-family:var(--font);font-weight:500;font-size:11px;letter-spacing:.06em;color:var(--dim);text-transform:none}
.mbtn.pri{background:var(--grad);border-color:transparent;box-shadow:0 8px 30px rgba(255,70,20,.3)}
.mbtn.pri small{color:rgba(255,255,255,.85)}
.menuR{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:10px;min-width:0}
.carTag{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 18px;text-align:right;max-width:340px}
.carTag .n{font-family:var(--disp);font-weight:800;font-style:italic;font-size:24px;letter-spacing:.08em;text-transform:uppercase}
.carTag .c{color:var(--acc);font-size:11px;letter-spacing:.3em;text-transform:uppercase}
.gfxBadge{position:absolute;right:calc(var(--sar) + 18px);top:calc(var(--sat) + 14px);display:flex;gap:8px;align-items:center}

/* ---------- selection cards ---------- */
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;transition:border-color .15s,background .15s,transform .12s;display:block;width:100%;overflow:hidden}
.card:hover{border-color:var(--line2)}
.card.sel{border-color:var(--acc);background:linear-gradient(180deg,rgba(255,90,20,.14),rgba(20,18,20,.72));box-shadow:0 0 0 1px rgba(255,90,20,.35) inset}
.card.lock{opacity:.7}
.card h4{margin:0;font-family:var(--disp);font-size:17px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}
.card p{margin:6px 0 0;color:var(--dim);font-size:13px;line-height:1.42}
.card ul{margin:8px 0 0;padding:0;list-style:none;font-size:12px;color:var(--dim)}
.card li{padding:2px 0 2px 16px;position:relative}.card li::before{content:"▸";position:absolute;left:0;color:var(--acc)}
.card .tg{position:absolute;right:12px;top:12px;display:flex;gap:6px}
.pill{display:flex;gap:6px;flex-wrap:wrap}
.opt{min-height:38px;padding:0 15px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);transition:all .12s}
.opt:hover{color:var(--tx);border-color:var(--line2)}
.opt.sel{background:var(--grad);color:#fff;border-color:transparent}
.opt.off{opacity:.35;pointer-events:none}
.lbl{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 7px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:700}
.lbl:first-child{margin-top:0}.lbl i{font-style:normal;color:var(--tx);font-family:var(--mono);letter-spacing:0;font-size:12px}
.hint{font-size:12px;color:var(--mute);line-height:1.45;margin-top:6px}

/* toggles & sliders */
.tog{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);min-height:46px}
.tog:last-child{border-bottom:0}
.tog .t{font-size:14px}.tog .t small{display:block;color:var(--mute);font-size:12px;margin-top:2px;line-height:1.35}
.sw{position:relative;flex:0 0 auto;width:50px;height:28px;border-radius:99px;background:rgba(255,255,255,.14);transition:background .18s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .18s}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(22px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;touch-action:pan-y;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--acc) var(--p,50%),rgba(255,255,255,.16) var(--p,50%))}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:rgba(255,255,255,.16)}
input[type=range]::-moz-range-progress{height:5px;border-radius:5px;background:var(--acc)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--acc);margin-top:-8.5px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex:0 0 auto;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:0 18px;min-height:40px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-family:var(--disp);font-weight:700;letter-spacing:.14em;font-size:13px;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.tab.sel{background:var(--grad);color:#fff;border-color:transparent}

/* stat bars */
.stat{display:grid;grid-template-columns:86px 1fr 44px;align-items:center;gap:10px;font-size:12px;margin:7px 0;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.stat .b{height:7px;border-radius:7px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.stat .b i{position:absolute;left:0;top:0;bottom:0;background:var(--grad);border-radius:7px;transition:width .3s}
.stat .b em{position:absolute;top:0;bottom:0;background:rgba(56,214,139,.9);border-radius:0 7px 7px 0}
.stat span:last-child{font-family:var(--mono);color:var(--tx);text-align:right}

/* swatches */
.sws{display:flex;flex-wrap:wrap;gap:8px}
.swc{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.18);position:relative;transition:transform .1s}
.swc:hover{transform:scale(1.1)}
.swc.sel{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.upg{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.upg:last-child{border-bottom:0}
.upg .nm{font-family:var(--disp);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.upg .ds{grid-column:1;color:var(--mute);font-size:12px}
.pips{display:flex;gap:4px;grid-column:1}
.pips i{width:22px;height:6px;border-radius:3px;background:rgba(255,255,255,.14)}.pips i.on{background:var(--grad)}
.upg .btn{grid-row:1/4;grid-column:2}

/* track card */
.trk{display:flex;gap:12px;align-items:center}
.trk canvas{width:84px;height:62px;flex:0 0 auto;background:rgba(0,0,0,.35);border-radius:8px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;text-align:left;padding:6px 8px;font-weight:700}
.tbl td{padding:8px;border-top:1px solid var(--line);font-family:var(--mono);font-size:13px}
.tbl tr.me td{background:rgba(255,90,20,.16);color:#fff}
.tbl td:first-child{font-weight:800;width:34px}
.big{font-family:var(--disp);font-weight:800;font-style:italic;letter-spacing:.04em}
.xp{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}.xp i{display:block;height:100%;background:var(--grad)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;font-family:var(--disp)}
#hud *{pointer-events:none}
#hud .clickable,#hud .clickable *{pointer-events:auto}
.hudbox{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#hPos{left:calc(var(--sal) + 14px);top:calc(var(--sat) + 12px);padding:6px 14px 8px;display:flex;align-items:baseline;gap:6px}
#hPos .n{font-size:clamp(36px,7vw,58px);font-weight:800;font-style:italic;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#hPos .o{font-size:clamp(14px,2.4vw,20px);color:var(--dim);font-weight:700}
#hLap{left:calc(var(--sal) + 14px);top:calc(var(--sat) + 86px);padding:6px 12px;min-width:150px;font-size:13px;letter-spacing:.12em;color:var(--dim)}
#hLap b{color:var(--tx);font-size:17px;font-family:var(--mono);letter-spacing:0}
#hLap .r{display:flex;justify-content:space-between;gap:12px;align-items:baseline;line-height:1.5}
#hTower{left:calc(var(--sal) + 14px);top:calc(var(--sat) + 204px);padding:6px 8px;font-family:var(--mono);font-size:12px;min-width:152px}
#hTower .tr{display:grid;grid-template-columns:20px 1fr auto;gap:8px;padding:2px 4px;border-radius:5px;color:var(--dim);white-space:nowrap}
#hTower .tr.me{background:var(--grad);color:#fff;font-weight:800}
#hTower .tr b{color:inherit;font-weight:800}
#hRight{right:calc(var(--sar) + 14px);top:calc(var(--sat) + 12px);display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#hMap{width:clamp(110px,16vw,176px);height:clamp(110px,16vw,176px);border-radius:14px;background:var(--panel);border:1px solid var(--line)}
#hCam{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--panel);border:1px solid var(--line);pointer-events:auto}
#hCam button{pointer-events:auto;min-width:46px;height:34px;padding:0 10px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
#hCam button small{font-size:8px;font-family:var(--mono);opacity:.7;letter-spacing:0}
#hCam button.sel{background:var(--grad);color:#fff}
#hGauges{left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + var(--gb,12px));padding:8px 18px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;width:var(--gw,min(380px,56vw))}
#hSpeedRow{display:flex;align-items:baseline;gap:16px}
#hSpd{font-size:clamp(40px,calc(var(--gw,380px)*.19),74px);font-weight:800;font-style:italic;line-height:.95;font-family:var(--disp);min-width:2.3ch;text-align:right}
#hUnit{font-size:13px;color:var(--dim);letter-spacing:.2em;margin-left:-6px;font-weight:700}
#hGear{font-size:clamp(30px,5vw,46px);font-weight:800;color:var(--acc3);min-width:1.2ch;text-align:center;font-style:italic}
#hRpm{width:100%;height:9px;border-radius:5px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
#hRpm i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3de0ff,#ffd23d 70%,#ff3030);border-radius:5px}
#hRpm::after{content:"";position:absolute;left:84%;top:0;bottom:0;width:16%;background:rgba(255,40,40,.28)}
#hNit{width:100%;height:11px;border-radius:6px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
#hNit i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2a7dff,#79d7ff);border-radius:6px;transition:filter .1s}
#hNit.on i{filter:brightness(1.6) drop-shadow(0 0 6px #6cf)}
#hNit span{position:absolute;left:8px;top:-1px;font-size:8px;font-weight:800;letter-spacing:.2em;color:rgba(255,255,255,.8);line-height:11px;font-family:var(--font)}
#hDmg{display:flex;align-items:center;gap:8px;width:100%;font-size:9px;letter-spacing:.18em;color:var(--dim);font-weight:800}
#hDmg .bar2{flex:1;height:5px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}#hDmg .bar2 i{display:block;height:100%;background:var(--ok)}
#hCenter{left:50%;top:calc(var(--sat) + 74px);transform:translateX(-50%);text-align:center;width:min(92vw,640px);background:none!important;border:0;backdrop-filter:none}
#hBig{font-size:clamp(70px,16vw,160px);font-weight:800;font-style:italic;line-height:1;text-shadow:0 6px 40px rgba(0,0,0,.6);opacity:0;transform:scale(1.5);transition:opacity .14s,transform .22s}
#hBig.show{opacity:1;transform:scale(1)}
#hBig.go{background:linear-gradient(100deg,#2bd47a,#9dffb0);-webkit-background-clip:text;background-clip:text;color:transparent}
#hMsg{font-size:clamp(14px,2.6vw,22px);letter-spacing:.2em;text-transform:uppercase;font-weight:800;min-height:1.4em;text-shadow:0 2px 14px rgba(0,0,0,.8)}
#hMsg.bad{color:var(--bad)}#hMsg.good{color:var(--ok)}#hMsg.warn{color:var(--acc3)}

(function () {

    });

/* ======================================================================
   03 · TRACK GENERATOR — spline circuits, banking, racing line, queries
   Lateral convention: offset > 0 is to the RIGHT of the direction of travel.
   Heading psi: forward = (sin psi, cos psi), right = (-cos psi, sin psi).
   ====================================================================== */
function makeQ() { return { i: 0, t: 0, s: 0, off: 0, y: 0, w: 14, bank: 0, psi: 0, kap: 0, dist: 0, cx: 0, cz: 0, bar: 20 }; }

function buildTrack(def, opts) {
  opts = opts || {};
  const reverse = !!opts.reverse;
  let pts = def.pts.map(p => [p[0], p[1], p[2] || 0, p[3] || 1]);
  if (reverse) { const first = pts[0]; pts.reverse(); pts.unshift(pts.pop()); pts[0] = first; }
  const n = pts.length, SUB = 40;
  // ---- dense spline
  const dx = [], dy = [], dz = [], dw = [];
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    for (let k = 0; k < SUB; k++) {
      const t = k / SUB;
      dx.push(crClosed(p0[0], p1[0], p2[0], p3[0], t));
      dz.push(crClosed(p0[1], p1[1], p2[1], p3[1], t));
      dy.push(crClosed(p0[2], p1[2], p2[2], p3[2], t));
      dw.push(crClosed(p0[3], p1[3], p2[3], p3[3], t));
    }
  }
  const M = dx.length, cum = new Float64Array(M + 1);
  for (let i = 0; i < M; i++) {
    const j = (i + 1) % M;
    cum[i + 1] = cum[i] + Math.hypot(dx[j] - dx[i], dz[j] - dz[i]);
  }
  const L = cum[M];
  const N = Math.max(64, Math.round(L / 3));
  const ds = L / N;
  const X = new Float64Array(N), Y = new Float64Array(N), Z = new Float64Array(N), WS = new Float64Array(N);
  { let k = 0;
    for (let j = 0; j < N; j++) {
      const target = j * ds;
      while (k < M - 1 && cum[k + 1] < target) k++;
      const seg = cum[k + 1] - cum[k], t = seg > 1e-9 ? (target - cum[k]) / seg : 0, k2 = (k + 1) % M;
      X[j] = lerp(dx[k], dx[k2], t); Z[j] = lerp(dz[k], dz[k2], t);
      Y[j] = lerp(dy[k], dy[k2], t); WS[j] = lerp(dw[k], dw[k2], t);
    } }
  const smoothArr = (a, passes, wrap) => {
    const b = new Float64Array(a.length);
    for (let p = 0; p < passes; p++) {
      for (let i = 0; i < a.length; i++) b[i] = (a[(i - 1 + a.length) % a.length] + 2 * a[i] + a[(i + 1) % a.length]) * 0.25;
      a.set(b);
    }
  };
  smoothArr(X, 2); smoothArr(Z, 2); smoothArr(Y, 6); smoothArr(WS, 8);
  // ---- tangents, heading, curvature
  const TX = new Float64Array(N), TZ = new Float64Array(N), RX = new Float64Array(N), RZ = new Float64Array(N);
  const PSI = new Float64Array(N), KAP = new Float64Array(N), W = new Float64Array(N), BANK = new Float64Array(N);
  const S = new Float64Array(N + 1);
  for (let i = 0; i < N; i++) {
    const a = (i - 1 + N) % N, b = (i + 1) % N;
    let tx = X[b] - X[a], tz = Z[b] - Z[a]; const l = Math.hypot(tx, tz) || 1; tx /= l; tz /= l;
    TX[i] = tx; TZ[i] = tz; RX[i] = -tz; RZ[i] = tx; PSI[i] = Math.atan2(tx, tz);
    W[i] = def.width * WS[i]; S[i] = i * ds;
  }
  S[N] = L;
  for (let i = 0; i < N; i++) {
    const a = (i - 2 + N) % N, b = (i + 2) % N;
    KAP[i] = wrapAngle(PSI[b] - PSI[a]) / (4 * ds);
  }
  smoothArr(KAP, 4);
  const maxBank = def.maxBank != null ? def.maxBank : 0.075;
  for (let i = 0; i < N; i++) BANK[i] = clamp(KAP[i] * (def.bankGain || 6.5), -maxBank, maxBank);
  smoothArr(BANK, 6);
  // ---- barrier offset (distance from centre line)
  const BAR = new Float64Array(N);
  for (let i = 0; i < N; i++) BAR[i] = W[i] * 0.5 + 8.5 + 3.2 * (vnoise(i * 0.021 + def.seed, 7.3) - 0.5) * 2;
  smoothArr(BAR, 8);
  // ---- racing line (min-curvature relaxation inside track limits)
  const margin = 2.6;
  const LO = new Float64Array(N); // lateral offset of the ideal line
  for (let it = 0; it < 260; it++) {
    for (let i = 0; i < N; i++) {
      const a = (i - 1 + N) % N, b = (i + 1) % N;
      const px = X[i] + RX[i] * LO[i], pz = Z[i] + RZ[i] * LO[i];
      const ax = X[a] + RX[a] * LO[a], az = Z[a] + RZ[a] * LO[a];
      const bx = X[b] + RX[b] * LO[b], bz = Z[b] + RZ[b] * LO[b];
      const mx = (ax + bx) * 0.5, mz = (az + bz) * 0.5;
      const lim = Math.max(0.5, W[i] * 0.5 - margin);
      LO[i] = clamp(LO[i] + ((mx - px) * RX[i] + (mz - pz) * RZ[i]) * 0.55, -lim, lim);
    }
  }
  smoothArr(LO, 4);
  const LX = new Float64Array(N), LZ = new Float64Array(N), LK = new Float64Array(N), LPSI = new Float64Array(N);
  for (let i = 0; i < N; i++) { LX[i] = X[i] + RX[i] * LO[i]; LZ[i] = Z[i] + RZ[i] * LO[i]; }

/* Persist race rewards / records. Returns the same results object (augmented). */
function awardRace(R, res) {

  const rec = P.records[key] || (P.records[key] = {});
  let credits = 0; const bon = [];
  if (R.mode === 'tt') {
    const bl = res.best || 0;
    if (bl > 0) {
      const medal = bl <= R.medals.gold ? 'gold' : bl <= R.medals.silver ? 'silver' : bl <= R.medals.bronze ? 'bronze' : null;
      res.medal = medal;
      const rank = { bronze: 1, silver: 2, gold: 3 }, mk = key + ':' + R.cfg.car, old = P.medals[mk] || 0;
      if (medal && rank[medal] > old) { const pay = { bronze: 600, silver: 1200, gold: 2400 }[medal]; credits += pay; bon.push([medal.toUpperCase() + ' medal', pay]); P.medals[mk] = rank[medal]; }
      credits += 250; bon.push(['Time trial session', 250]);
    }
  } else {
    const base = [3200, 2400, 1900, 1500, 1200, 1000, 800, 650, 520, 420][Math.min(res.pos - 1, 9)] || 400;
    const lapScale = R.mode === 'sprint' ? 0.8 : 0.75 + R.laps * 0.12;
    const b = Math.round(base * diff.reward * lapScale / 50) * 50;
    credits += b; bon.push(['Finish P' + res.pos, b]);
    if (res.fastestLap && R.mode === 'circuit') { credits += 500; bon.push(['Fastest lap', 500]); }
    if (res.damage < 0.12 && res.pos <= Math.ceil(n / 2)) { credits += 350; bon.push(['Clean race', 350]); }
    if (res.overtakes >= 3) { const o = Math.min(res.overtakes, 12) * 60; credits += o; bon.push(['Overtakes ×' + res.overtakes, o]); }
    if (res.drift > 80) { const dd = Math.min(900, Math.round(res.drift / 2)); credits += dd; bon.push(['Drift score', dd]); }
  }
  res.credits = credits; res.xp = Math.round(credits / 9 + 30);
  P.credits += credits; const oldLvl = playerLevel(); P.xp += res.xp; res.levelUp = playerLevel() > oldLvl ? playerLevel() : 0;
  res.bonuses = bon;
  const st = P.stats; st.races++; if (R.mode !== 'tt') { if (res.pos === 1) st.wins++; if (res.pos <= 3) st.podiums++; }
  st.dist += res.dist; st.top = Math.max(st.top, res.topSpeed); st.drift += res.drift; st.time += R.t;
  // records
  const lb = res.best; if (lb && (!rec.bestLap || lb < rec.bestLap)) { rec.bestLap = lb; rec.bestLapCar = R.player.def.name; res.newRecord = true; }
  if (R.mode !== 'tt' && res.pos === 1 && res.time) { const rk = R.mode + R.laps; if (!rec[rk] || res.time < rec[rk]) { rec[rk] = res.time; res.newRaceRecord = true; } }
  if (R.ghost.best && R.mode === 'tt') { const gk = key + ':' + R.cfg.car, g = P.ghosts[gk]; if (!g || R.ghost.best.t < g.t) P.ghosts[gk] = R.ghost.best; }
  // championship
  if (R.cfg.champ) {
    const ch = P.champ.active;
    if (ch) {
      const pts = {}; res.rows.forEach(r => { pts[r.name] = POINTS[r.pos - 1] || 0; });
      Object.keys(pts).forEach(k => { ch.points[k] = (ch.points[k] || 0) + pts[k]; });
      ch.round++; res.champ = { points: pts, round: ch.round, total: SERIES.find(s => s.id === ch.series).rounds.length };
      if (ch.round >= res.champ.total) {
        const ser = SERIES.find(s => s.id === ch.series), table = Object.keys(ch.points).map(k => [k, ch.points[k]]).sort((a, b) => b[1] - a[1]);
        const rank = table.findIndex(t => t[0] === 'YOU') + 1;
        res.champ.final = { rank, table, series: ser.name };
        if (rank === 1) { P.credits += ser.reward; P.xp += ser.xp; res.champ.final.reward = ser.reward; P.champ.done[ser.id] = 1; }
        else if (rank <= 3) { const rw = Math.round(ser.reward * 0.3); P.credits += rw; res.champ.final.reward = rw; if (rank <= 3 && !P.champ.done[ser.id] && rank === 2) { /* podium keeps next series locked */ } }
        P.champ.active = null;
      }
    }
  }
  R.cfg.last = null; writeSave(); return res;
}
